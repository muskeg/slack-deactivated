<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slack Deactivated Avatar Generator</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Deactivated Account Avatar</h1>
      <p class="subtitle">Generate a Slack-style deactivated profile picture</p>

      <div id="drop-zone" role="button" tabindex="0" aria-describedby="drop-hint status">
        <p id="drop-hint">Drop an image here or click to browse</p>
        <input type="file" id="file-input" accept="image/*" />
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div id="preview-section" class="hidden">
        <canvas id="preview"></canvas>
        <div id="controls">
          <label>
            <input type="checkbox" id="grayscale" />
            Grayscale
          </label>
          <button id="download">Download PNG</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
